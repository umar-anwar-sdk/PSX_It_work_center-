{% extends 'base.html' %}
{% block title %}{{ code }} · PSX Market{% endblock %}
{% block content %}
<main class="auth-shell">
  <section class="login-card" aria-labelledby="error-title">
    <div class="login-logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="28" height="28" fill="currentColor"><path d="M5 24V12h4v12H5Zm6 0V7h4v17h-4Zm6 0V4h4v20h-4Zm6 0V10h4v14h-4Z"/><path d="M4 26h24" stroke="currentColor" stroke-width="2"/></svg></div>
    <p class="eyebrow">PSX Market Intelligence</p>
    <h1 id="error-title">{{ code }}</h1>
    <p>{{ message }}</p>
    <a class="primary-button" href="{% url 'home' %}">Return to dashboard</a>
  </section>
</main>
{% endblock %}
